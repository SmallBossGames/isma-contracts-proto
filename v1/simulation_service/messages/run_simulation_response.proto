syntax = "proto3";

package ru.nstu.isma.contracts.v1.simulation_service;

option csharp_namespace = "Isma.Contracts.V1.SimulationService";
option go_package = "github.com/isma/contracts/v1/simulation_service";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.v1.simulation_service";

/* 
 * Response to RunSimulation request.
 * 
 * Returned immediately after the simulation is accepted for execution.
 * The simulation runs asynchronously on the server.
 * 
 * Use the simulation_id to:
 *   - Monitor progress via MonitorSimulation
 *   - Retrieve results via GetSimulationResult
 *   - Cancel execution via CancelSimulation
 */
message RunSimulationResponse {
  // Auto-incremented unique identifier for this simulation.
  // Use this ID for all subsequent operations on this simulation.
  int64 simulation_id = 1;
}
