syntax = "proto3";

package ru.nstu.isma.contracts.v1.simulation_service;

option csharp_namespace = "Isma.Contracts.V1.SimulationService";
option go_package = "github.com/isma/contracts/v1/simulation_service";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.v1.simulation_service";

/* 
 * Request to retrieve completed simulation results.
 * 
 * After a simulation completes, call this RPC to obtain the download URL
 * for the result file. The actual file download uses HTTP (not gRPC)
 * via the embedded Ktor server on a separate Unix socket.
 * 
 * The result file is in binary format and is consumed by the chart viewer
 * for visualization of simulation output variables.
 */
message GetSimulationResultRequest {
  // ID of the completed simulation, returned from RunSimulationResponse.
  int64 simulation_id = 1;
}
