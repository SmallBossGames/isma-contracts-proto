syntax = "proto3";

package ru.nstu.isma.contracts.v1.simulation_service;

option csharp_namespace = "Isma.Contracts.V1.SimulationService";
option go_package = "github.com/isma/contracts/v1/simulation_service";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.v1.simulation_service";

/* 
 * Response to GetSimulationResult request.
 * 
 * Contains a relative URL path for downloading the simulation result file
 * via the embedded Ktor HTTP server. The download URL format is:
 *   /simulation/{simulationId}/download
 * 
 * The actual binary file download is served by Ktor on a separate Unix socket,
 * not via gRPC. gRPC is unsuitable for binary file transfer due to protobuf
 * framing overhead and memory constraints.
 */
message GetSimulationResultResponse {
  // HTTP download URL path for the result file.
  // Full download: {ktor-server-host}/simulation/{simulationId}/download
  // File format: Binary (consumed by chart viewer for visualization)
  string download_url = 2;
}
