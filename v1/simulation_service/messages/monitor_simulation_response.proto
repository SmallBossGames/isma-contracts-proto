syntax = "proto3";

package ru.nstu.isma.contracts.v1.simulation_service;

option csharp_namespace = "Isma.Contracts.V1.SimulationService";
option go_package = "github.com/isma/contracts/v1/simulation_service";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.v1.simulation_service";

/* 
 * Streaming response with current simulation progress.
 * 
 * Sent periodically by the server as a simulation advances through its
 * time range. Each message contains the simulation time boundaries and
 * the current time position.
 * 
 * Progress percentage can be calculated as:
 *   progress = (current_time - start_time) / (end_time - start_time)
 * 
 * The stream ends when the simulation reaches a terminal state.
 * 
 * Used by: UI progress bars, task tracking panels
 */
message MonitorSimulationResponse {
  // Original start time of simulation (t₀) — constant across all messages.
  double start_time = 1;
  
  // Original end time of simulation (tₙ) — constant across all messages.
  double end_time = 2;
  
  // Current simulation time — advances from start_time toward end_time.
  // This is the progress indicator. When current_time == end_time,
  // the simulation has completed.
  double current_time = 3;
}
